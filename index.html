<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live interactive webinar — Master Microsoft 365 Copilot & AI with AmBot365. Transform the way you work with Microsoft 365 + AI." />
    <title>Master Microsoft 365 Copilot &amp; AI — AmBot365 Webinar</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // The page is dark by default; light is opt-in via the toggle.
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'dark' && t !== 'light') t = 'dark'
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
