  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // The page is light by default; dark is opt-in via the toggle.
    // 'theme-pref': the old 'theme' key holds an auto-saved 'dark' for every past visitor.
    try {
      var t = localStorage.getItem('theme-pref')
      if (t !== 'dark' && t !== 'light') t = 'light'
      document.documentElement.setAttribute('data-theme', t)
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light')
    }
  </script>

  <!-- Meta Pixel Code
         The site's only two events: PageView on the home page, Purchase on
         /thank-you (same route test as src/main.jsx). Nothing is set up in
         the Event Setup Tool; its URL rules need a PageView on the page. -->
  <script>
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return; n = f.fbq = function () {
        n.callMethod ?
        n.callMethod.apply(n, arguments) : n.queue.push(arguments)
      };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
      n.queue = [];
      // The library itself loads after the page does (see afterPageLoad below);
      // until then fbq() calls queue up and are sent when it arrives.
      window.__deferredScripts = (window.__deferredScripts || []).concat(v);
    }(window, document, 'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '2083794112497728');
    function trackPage() {
      if (!/^\/thank-you\/?$/.test(location.pathname)) return fbq('track', 'PageView');
      // Skip inside an iframe, and skip if this browser already sent a
      // Purchase in the last 30 min (refresh, second tab, second page load).
      var last = 0;
      try { last = +localStorage.getItem('ty-purchase-at') || 0 } catch (e) { }
      if (window.top !== window.self || Date.now() - last < 30 * 60 * 1000) return;
      try { localStorage.setItem('ty-purchase-at', String(Date.now())) } catch (e) { }
      fbq('track', 'Purchase', { value: 499, currency: 'INR' });
    }
    // Chrome prerenders pages while the URL is being typed; that hidden copy
    // runs this script too, so wait until the page is actually shown.
    if (document.prerendering) {
      document.addEventListener('prerenderingchange', trackPage, { once: true });
    } else {
      trackPage();
    }
  </script>

  <!-- Analytics after load. Meta Pixel and Clarity were ~1s of main-thread
       work during start-up on mobile. Their queues above already record
       events, so nothing is lost: the scripts load once the page has finished
       loading and the browser is idle, or at the visitor's first interaction,
       whichever comes first. -->
  <script>
    (function () {
      var done = false;
      function load() {
        if (done) return; done = true;
        (window.__deferredScripts || []).forEach(function (src) {
          var s = document.createElement('script'); s.async = true; s.src = src;
          document.head.appendChild(s);
        });
      }
      function afterPageLoad() {
        var idle = window.requestIdleCallback || function (f) { setTimeout(f, 1500); };
        setTimeout(function () { idle(load, { timeout: 4000 }); }, 3500);
      }
      // The thank-you page sends the Purchase event: a buyer may close it
      // within seconds, so there the scripts load straight away.
      if (/^\/thank-you\/?$/.test(location.pathname)) load();
      else if (document.readyState === 'complete') afterPageLoad();
      else window.addEventListener('load', afterPageLoad, { once: true });
      ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (ev) {
        window.addEventListener(ev, load, { once: true, passive: true });
      });
    })();
  </script>
