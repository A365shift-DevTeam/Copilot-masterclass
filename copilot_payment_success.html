<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful | Microsoft 365 Copilot Masterclass</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: #062b70;
      background:
        radial-gradient(circle at 50% 0%, rgba(75, 190, 145, .18), transparent 32%),
        linear-gradient(180deg, #fff 0%, #fff 82%, #edfaff 100%);
      min-height: 100vh;
    }

    .page {
      max-width: 820px;
      min-height: 100vh;
      margin: auto;
      padding: 48px 24px 42px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .check {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #2f9a92, #69b451);
      box-shadow: 0 0 0 14px rgba(82, 180, 126, .10), 0 16px 36px rgba(42, 145, 114, .18);
      margin-bottom: 28px;
    }

    .check:after {
      content: "";
      width: 42px;
      height: 22px;
      border-left: 7px solid white;
      border-bottom: 7px solid white;
      transform: rotate(-45deg) translate(3px, -3px);
      border-radius: 3px;
    }

    .badge {
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid #bfe8d1;
      background: #effaf4;
      color: #31895b;
      font-weight: 800;
      letter-spacing: 1.5px;
      font-size: 14px;
    }

    h1 {
      margin: 26px 0 12px;
      font-size: clamp(38px, 7vw, 62px);
      line-height: 1.03;
      letter-spacing: -2px;
    }

    .confirmed {
      background: linear-gradient(90deg, #258b60, #35a47a, #39a7b3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 10px 0 34px;
      font-size: 21px;
      line-height: 1.5;
      color: #66758a;
    }

    .subtitle strong {
      color: #062b70
    }

    .whatsapp {
      width: min(100%, 680px);
      text-decoration: none;
      color: white;
      background: linear-gradient(100deg, #238a79, #65b747);
      padding: 23px 30px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 14px 32px rgba(45, 150, 101, .18);
      transition: .2s ease;
    }

    .whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(45, 150, 101, .25)
    }

    .wa-icon {
      width: 46px;
      height: 46px;
      border: 3px solid white;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: 900;
    }

    .support {
      margin-top: 34px;
      color: #64748b;
      font-size: 18px;
      line-height: 1.5;
    }

    .support a {
      color: #062b70;
      font-weight: 800;
      text-decoration: none
    }

    .note {
      margin-top: 14px;
      color: #91a0af;
      font-size: 13px
    }

    @media(max-width:520px) {
      .page {
        padding: 34px 18px
      }

      .check {
        width: 88px;
        height: 88px
      }

      .whatsapp {
        font-size: 21px;
        padding: 19px 18px;
        border-radius: 20px
      }

      .subtitle {
        font-size: 18px
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="check"></div>
    <div class="badge">PAYMENT SUCCESSFUL</div>

    <h1>Thank You!<br>Your Seat is <span class="confirmed">Confirmed</span></h1>

    <p class="subtitle">
      You're registered for the<br>
      <strong>Microsoft 365 Copilot Masterclass.</strong>
    </p>

    <!-- Replace YOUR_WHATSAPP_COMMUNITY_LINK with your actual WhatsApp Community invite URL -->
    <a class="whatsapp" href="YOUR_WHATSAPP_COMMUNITY_LINK" target="_blank" rel="noopener">
      <span class="wa-icon">☎</span>
      <span>Join the WhatsApp Community →</span>
    </a>

    <div class="support">
      For any support, email us at<br>
      <a href="mailto:connect@ambot365.in">connect@ambot365.in</a>
    </div>
  </main>
</body>

</html>
